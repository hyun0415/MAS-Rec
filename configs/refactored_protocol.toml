[experiment]
name = "portfolio_refactored_protocol"
seed = 42
batch_size = 32
maximum_epochs = 100
early_stopping_patience = 5
selection_metric = "mse"
restore_best_validation_weights = true

[split]
train = 0.70
validation = 0.10
test = 0.20
shared_index_file = "data/splits/split_indices.json"

[evaluation]
metrics = ["mae", "mse", "rmse", "mape"]
mape_scale = "fraction"
test_use = "final_evaluation_only"

